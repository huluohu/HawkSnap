# HawkSnap CI（plan D2/D6）：Rust 测试矩阵 + 前端测试/构建 + G6 i18n 覆盖率门
# + G1 体积断言 + tag 触发的发布流水线（产物 + updater latest.json 草稿 Release）。
#
# —— 跨平台编译重构（M4 Task P0）——
# `crates/hawksnap-platform-mac` 的 macOS 专属依赖（objc2*/screen-capture-kit/
# av-foundation/block2/dispatch2）已全部移入
# `[target.'cfg(target_os = "macos")'.dependencies]`，模块与平台 API 逐项
# `#[cfg(target_os = "macos")]` 门控，非 macOS 平台提供**同名同签名**的桩
# （明确 Err / 空值降级，绝不静默假装成功）。
#
# 门禁分档（2026-10-31 起，三腿全硬）：
#   - Linux（ubuntu-24.04）：**硬门**——该腿已在真实 Linux runner 上跑绿。
#   - macOS（macos-15）：**硬门**。（2026-10-31 从 macos-14 迁移：GitHub macos-14
#     镜像 2026-10 每日 14:00–24:00 UTC 棕色收缩、11-02 永久退役——10-30/31 两轮
#     macos-14 job 全部被 GitHub 收缩窗口取消，非代码回归。）
#   - Windows（windows-2022）：**硬门**（2026-10-31 从首轮软门翻入，软门期四个
#     未知项的解除记录见 rust-test matrix 处注释；update_signature 的 Windows
#     平台门控为唯一已记录例外）。
#
# 发布仍为 **macOS-only**：跨平台编译 ≠ 跨平台分发（Windows/Linux 的打包、
# 签名与 updater feed 口径另案裁定，见 release job 注）。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    # —— Windows 腿：**硬门**（2026-10-31 翻门）——
    #
    # 软门期遗留项的处置记录（评审修复轮 I2 的四个未知项全部解除）：
    #   1) WebView2 SDK / 2) xcap Windows 后端 / 3) rusqlite bundled——三者
    #      在真实 runner 上编译并跑通（lib 140/140，run 41102175475）；
    #   4) 路径/临时目录语义——history 的 os error 32 共享锁、native_messaging
    #      的 json! 转义均已按 Windows 语义修复（4228127）。
    # 唯一遗留：tests/update_signature.rs 在 Windows **进程加载阶段**死于
    # STATUS_ENTRYPOINT_NOT_FOUND（0xc0000139，DLL 入口点缺失，精确诊断需
    # Windows 真机查 import 表）——已在该文件用 #![cfg] 平台门控跳过并记录
    # （更新器 feed darwin-only，G7 保证力在 macOS/Linux 完整保留）。M5 跟进。
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # TODO: 接入 `cargo clippy --workspace -- -D warnings`。当前存量代码在
      # hawksnap-platform-mac 有 clippy 告警（neg_cmp_op_on_partial_ord），D2 裁定先
      # 不让 lint 噪音阻塞三平台 bring-up；D6 收口时仍未清理，启用顺延到告警清零后。
      - name: Install Linux system deps (webkit2gtk / tray / xcap X11+dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxtst-dev \
            libxkbcommon-dev libdbus-1-dev
      # —— 三平台同一条命令（macOS / Linux / Windows）：macOS 与 Linux 为**硬门**；
      #    Windows 首轮为**非阻塞平台验证**（见 matrix include 的理由与翻门条件）。
      #    非 macOS 平台上 macOS 专属的录屏/画中画/长截图/贴图/按键显示能力按 target
      #    门控为**桩**（明确 Err / 空值降级）；**截图走跨平台 xcap 后端**（X11 /
      #    Windows 上可能可用，未适配未实测）；其余纯逻辑（历史库、OCR、MP4 解析、
      #    GIF 编码、状态机）照常跑测。
      - name: cargo test --workspace (macOS / Linux / Windows)
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # G6 门（plan D2）：i18n key 覆盖率（A⊆Z、A⊆E、Z==E），违例 exit 1。
      - run: npm run check:i18n

  # ---- 浏览器插件（M4 P2：MV3 扩展，构建 + 纯逻辑单测）----
  #
  # 注意：仓库**尚未提交 plugin/package-lock.json**（插件仅 esbuild 一个 devDep，
  # 首跑 npm install 生成后应提交入库），故这里用 `npm install` 而非 `npm ci`——
  # `npm ci` 在无 lockfile 时硬失败。**lockfile 提交后，把下方 npm install 改回
  # npm ci**（与 frontend 腿同口径，享受缓存与可复现安装）。
  plugin-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install   # TODO: lockfile 提交后改为 npm ci
      - run: npm test
      - run: npm run build

  size:
    # G1 体积断言（≤15MB dmg，plan D2 落地、D6 起为正式门）。tauri build 慢是预期；
    # continue-on-error: false——此 job 即 G1 断言本体，红 = 不达标，不允许静默。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      # M4 P1（评审修复轮 P2）：size job 必须构建**与发布件同款**的产物。
      # 之前这里跑的是**不带** tauri.release.conf.json 的构建 → 那个 dmg 里
      # **没有** Native Messaging 宿主（externalBin 只在 release 配置里开）→
      # 体积门量的是一个「比发布件小」的 dmg（宿主 ~MB 级）→ 15MB 断言对真正
      # 发布出去的包**不成立**。故：先暂存宿主，再用带 externalBin 的配置构建。
      # 为什么用 tauri.host.conf.json 而不是 tauri.release.conf.json：后者还开了
      # bundle.createUpdaterArtifacts，缺 TAURI_SIGNING_PRIVATE_KEY 时 tauri CLI
      # 硬失败（PR/fork 无 secrets → 全红）。host conf 只开 externalBin，
      # updater 产物不进 dmg（macOS 的 updater 载荷是同目录的 .app.tar.gz + .sig），
      # 两者的 dmg 内容一致。
      - name: Stage native messaging host (M4 P1)
        run: scripts/package-native-host.sh
      - name: tauri build (with native host bundled)
        working-directory: app
        run: npm run tauri build -- --config src-tauri/tauri.host.conf.json --bundles app dmg
      - name: check size (G1)
        run: bash scripts/check-size.sh

  # 官网部署已拆分至 .github/workflows/deploy-site.yml（2026-10-28：Pages 服务
  # 状态异常时 pages job 会把整个 pipeline 拖成 startup_failure，独立 workflow 隔离故障域）。
  # ---- 发布流水线（plan D6 → 2026-10-31 多平台化，形态参考 Ottr release.yml）----
  #
  # 控制器前置条件（首次 tag 推送前必须完成，缺一签名步骤即硬失败——有意为之，
  # 未签名产物绝不能进入 Release / updater feed）：
  #   1. GitHub repo Secrets 配置：
  #        TAURI_SIGNING_PRIVATE_KEY           — Ed25519 私钥（`npm run tauri signer generate`）
  #        TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — 私钥口令（无口令则设为空串）
  #   2. tauri.conf.json 的 plugins.updater.pubkey 填入配对公钥（已随 0.1.0 填入，
  #      8123f6c；更换密钥 = 替换此处 + conf + secrets）。
  # 两者齐备后：push tag v* → release 四腿矩阵构建+签名（mac arm/intel + win + linux）
  # → publish 组装多平台 latest.json 并创建【草稿】Release，控制器人工复核后发布
  # （plan D7；Ottr 直接发布，HawkSnap 保留草稿复核纪律）。
  #
  # **多平台发布口径（2026-10-31，用户裁定「参考 Ottr」）**：
  #   - macOS（arm64 原生 + x86_64 交叉编译）：app + dmg，adhoc/自签证书（见下）；
  #   - Windows：NSIS（*-setup.exe，updater 载荷）+ MSI（附加分发件）——无证书，
  #     SmartScreen 会告警（已知限制）；
  #   - Linux：AppImage（updater 载荷）+ deb + rpm；
  #   - updater feed = 四平台键齐全（darwin-aarch64/darwin-x86_64/windows-x86_64/
  #     linux-x86_64），同一 Ed25519 密钥签全平台更新件（minisign 与平台无关）。
  #   - 功能差异如实声明（README 平台表）：录屏/媒体键类 macOS 专属；截图走 xcap
  #     跨平台后端；编译与测试已由 rust-test 三腿硬门把守，打包段为新增路径——
  #     首个 tag 构建即真验证。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    # 签名私钥只进本 job 的构建环境。缺失/为空时 tauri CLI 在签名阶段硬失败
    # （实测两种报错："A public key has been found, but no private key" /
    # "failed to decode secret key"），本 job 红 = 未签名产物绝不发布（有意为之）。
    # 注意：pubkey 已随 0.1.0 填入（8123f6c）；若 pubkey 缺失/被回退为占位，同样
    # 硬失败（无法 base64 解码）——pubkey 与 secrets 必须始终配对且先于 tag。
    # 签名策略：更新器签名 = TAURI_SIGNING_PRIVATE_KEY（全平台同一把 Ed25519）；
    # macOS 代码签名用 HawkSnapCodesign 自签证书（TCC 授权按证书锚定，用户升级后
    # 屏幕录制/辅助功能授权持久；adhoc 签名每次构建失配）。bundler 检测到
    # APPLE_CERTIFICATE 即自动签名；secrets 未配置时仅 macOS 产物退回 adhoc（有告警）。
    # 用户本地构建：scripts/sign-local.sh 重签可持久化 TCC 授权。Win/Linux 忽略
    # macOS 证书相关 env。
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # 稳定代码签名身份（Ottr 同款方案，2026-10-31）：自签证书锚定 HawkSnapCodesign，
      # 修复「每次升级 TCC 授权失效」——adhoc 签名的 DR = cdhash，每构建必变，用户授权
      # 过的旧条目对不上新二进制（系统设置还显示已勾选）。证书锚定后跨版本一致，TCC
      # 记录永久匹配。bundler 读 APPLE_CERTIFICATE(+PASSWORD) 自动导入签名；secrets
      # 未配置时 macOS 产物退回 adhoc（有告警）。Win/Linux 忽略证书相关 env。
      APPLE_SIGNING_IDENTITY: HawkSnapCodesign
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            bundles: "app dmg"
            source_archive: true
          # Intel 包：macos-13（Intel 金属机型）已被 GitHub 淘汰（Ottr v0.2.0 实测
          # 卡 30 分钟等不到 runner）——在 arm runner 上交叉编译（ Ottr 同款）。
          - name: macos-intel
            os: macos-15
            rust_target: x86_64-apple-darwin
            bundles: "app dmg"
          - name: windows-x64
            os: windows-2022
            bundles: "nsis msi"
          - name: linux-x64
            os: ubuntu-24.04
            bundles: "appimage deb rpm"
    runs-on: ${{ matrix.os }}
    steps:
      # fetch-depth: 0 —— 「对应源码包」用 `git archive <tag>` 生成，
      # 必须能取到 tag 对象；浅克隆（默认 depth=1）没有 tag 引用。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      # 自签证书导入 + 信任（Ottr 同款，2026-10-31）：bundler 按「有效身份」解析
      # （security find-identity -v），自签证书不加信任会报 failed to resolve signing
      # identity。secrets 未配置（APPLE_CERTIFICATE 为空）→ 跳过，退回 adhoc。
      - name: Import code signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE 未配置 → adhoc 签名（TCC 授权跨版本不持久；配置 secrets 后自动启用稳定签名）"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PW=$(openssl rand -hex 16)
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # 防锁定（Ottr 实测）：钥匙串默认策略会在长编译期自动锁定 → codesign 等解锁弹窗假死
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 720000 "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -clcerts -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -k "$KEYCHAIN_PATH" "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          # 冒烟签名：让签名链路问题在导入步骤即刻失败，而非编译 10 分钟后假死
          cp /bin/echo "$RUNNER_TEMP/smoke-sign-bin"
          codesign --force --sign HawkSnapCodesign "$RUNNER_TEMP/smoke-sign-bin"
          rm -f "$RUNNER_TEMP/smoke-sign-bin"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      # Linux 打包系统依赖（Ottr 同款清单；appindicator = 托盘）。
      - name: Install Linux system dependencies
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # --config 合入 src-tauri/tauri.release.conf.json（bundle.createUpdaterArtifacts: true
      # **且** bundle.externalBin 宿主——updater 归档与 dmg 同一次构建、完全同口径）。
      # 为何 createUpdaterArtifacts 独立成覆盖文件而不写进 tauri.conf.json：该开关开启后
      # tauri CLI 在缺
      # TAURI_SIGNING_PRIVATE_KEY 时硬失败（"A public key has been found, but no private
      # key"）——push 分支 / PR 的 keyless 构建（rust-test/size）会全红；只在 release job
      # 合入，配合上方 secrets 缺失即失败 = 未签名产物绝不发布（有意为之）。
      # --bundles 各平台只造发布所需（G1 dmg 门槛由 size job 把守）。
      # 产物布局（tauri v2，createUpdaterArtifacts: true 时 v2 updater 直接用安装器
      # 本体 + 同名 .sig；macOS 为 .app.tar.gz 归档 + .sig）：
      #   macOS   bundle/macos/HawkSnap.app.tar.gz{,.sig} + dmg/*.dmg
      #   Windows bundle/nsis/HawkSnap_*-setup.exe{,.sig} + msi/*.msi{,.zip…}
      #   Linux   bundle/appimage/*_amd64.AppImage{,.sig} + deb/ + rpm/
      # M4 P1：Native Messaging 宿主（hawksnap-host）是 feature 门控的独立 bin，
      # 默认构建不含它 → 必须**先**构建并暂存给 tauri-bundler（externalBin，
      # 见 src-tauri/tauri.release.conf.json 的
      # bundle.externalBin: ["binaries/hawksnap-host"]），bundler 才会把它复制进
      # .app（Contents/MacOS/hawksnap-host）。顺序很关键：bundler 先产出
      # .app.tar.gz，事后再往 .app 里拷已经晚于归档生成。
      # 暂存路径 app/src-tauri/binaries/hawksnap-host-<triple>[.exe] 不入库（.gitignore）。
      # （评审修复轮 P1：tauri v2 的 externalBin 是**文件名后缀**语义——
      #  bundler 找的是 binaries/hawksnap-host-<triple>，不是 binaries/<triple>/…。）
      # Intel 交叉构建传 --target（脚本同步按 target triple 暂存 + 取产物路径）。
      - name: "Stage native messaging host (M4 P1)"
        shell: bash
        run: scripts/package-native-host.sh ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
      # 打包段重试（Ottr v1.5.8 实挂同款）：macOS 的 bundle_dmg.sh 靠 hdiutil 挂盘 +
      # AppleScript 驱动 Finder 排图标，无头 runner 上会间歇静默失败。cargo/vite 缓存
      # 全命中，重试只重跑打包段；重试前卸掉残留挂载卷（不卸则 attach 报 Resource busy）。
      - name: "tauri build (per-OS bundles)"
        working-directory: app
        shell: bash
        run: |
          built=""
          for attempt in 1 2 3; do
            if npm run tauri build -- --config src-tauri/tauri.release.conf.json \
                 --bundles ${{ matrix.bundles }} \
                 ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}; then
              built=1
              break
            fi
            [ "$attempt" -lt 3 ] || break
            echo "::warning::tauri build 第 $attempt 次失败，清残留挂载后重试"
            for vol in /Volumes/HawkSnap*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            sleep 15
          done
          [ -n "$built" ] || { echo "::error::tauri build 三次均失败"; exit 1; }
          # 交叉构建的 bundle 落在 workspace 根 target/<triple>/ 下——归位到标准路径
          # 供统一上传通配（原生构建无此目录，跳过）。注意 cwd=app/ → 上级目录路径。
          if [ -n "${{ matrix.rust_target }}" ]; then
            mkdir -p ../target/release/bundle
            cp -R "../target/${{ matrix.rust_target }}/release/bundle/." ../target/release/bundle/
          fi
      # 双 mac 腿的 updater 产物撞名（HawkSnap.app.tar.gz 不含架构）→ merge-multiple
      # 下载时后者覆盖前者——上传前按架构改名（Ottr 同款；make-latest 按
      # *aarch64*/*x86_64* 模式匹配）。
      - name: Disambiguate macOS updater artifacts (per-arch)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then arch=x86_64; else arch=aarch64; fi
          dir=target/release/bundle/macos
          for f in "$dir/HawkSnap.app.tar.gz" "$dir/HawkSnap.app.tar.gz.sig"; do
            if [ -f "$f" ]; then
              mv "$f" "$dir/HawkSnap_${arch}.app.tar.gz${f##*/HawkSnap.app.tar.gz}"
            fi
          done
          ls -la "$dir"
      - name: Upload updater payload + artifacts (per-OS)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.zip
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/**/*.sig
      # —— 「对应源码」包（随 Release 附源码归档）——
      # 二进制分发必须附对应源码：git archive 该 tag 的**已提交内容**（含 Cargo.lock
      # = 构建脚本与依赖锁定信息），随 Release 一起发布。发布出去的源码包与仓库
      # 同源同版（tag 即版本），二进制发布随附对应源码（透明构建惯例）。
      # 只在 arm64 腿产一次（矩阵去重）。
      - name: Build source archive (corresponding source)
        if: matrix.source_archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="HawkSnap-${GITHUB_REF_NAME}/" \
            -o "dist/HawkSnap-${GITHUB_REF_NAME}-source.tar.gz" \
            "${GITHUB_REF_NAME}"
          tar -tzf "dist/HawkSnap-${GITHUB_REF_NAME}-source.tar.gz" | head -5
      - name: Upload source archive
        if: matrix.source_archive
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          if-no-files-found: error
          path: dist/HawkSnap-*-source.tar.gz

  # 组装 updater feed 并建【草稿】Release：latest.json 的 URL 指向该 tag 的
  # Release 下载地址（与 tauri.conf.json 的 updater endpoint
  # releases/latest/download/latest.json 同一通道）；草稿态控制器人工复核、补全
  # Release 说明（已知限制：macOS-only 发布、G5 N/A、Rust 文案未 i18n）后发布（plan D7）。
  #
  # 依赖关系：needs: release —— release（macOS 腿）红 = 无签名产物 → 本 job 不跑，
  # **绝不产出无签名的 Release / feed**（未签名产物不得发布，有意为之）。
  # needs 只列 release 一个 job（不再有矩阵）→ release 绿即本 job 跑，无条件判断
  # 悬空；`if: startsWith(github.ref, 'refs/tags/v')` 与 release 的触发条件一致。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 多平台发布（2026-10-31）→ feed 四平台键齐全。--platforms 显式指定参与平台：
      # make-latest 对**列出的**平台强制「恰好 1 份 + 签名齐全」（脏 feed 防线），
      # 任一平台缺失即 publish 红 = 半成品 Release 绝不出门。
      - name: Assemble latest.json (updater feed)
        run: node scripts/make-latest.mjs --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dist dist --out dist --platforms darwin-aarch64,darwin-x86_64,windows-x86_64,linux-x86_64
      # （run 40591912444 根因修复）原实现 `gh release create … dist/*` 把
      # download-artifact 合并出的**目录**（dist/dmg、dist/macos）也当 asset 传给
      # gh → "read dist/macos: is a directory"。且上次失败的 run 已留下同名草稿
      # Release（含半成品 asset），重跑时 `gh release create` 会硬失败（已存在）
      # → publish 永远红。故拆成两步：先幂等建草稿（存在即复用），再**显式列出
      # 具体文件**上传；--clobber 覆盖上次失败遗留的同名半成品 asset。
      - name: Create draft GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在（失败 run 留下的草稿）——复用；asset 由下一步 --clobber 覆盖。"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "HawkSnap $GITHUB_REF_NAME" \
              --notes "Draft assembled by CI (plan D6). Multi-platform binary release (2026-10-31: macOS arm64/intel + Windows x64 + Linux x64, Ottr-style matrix). Known limitations: macOS dmg is adhoc/自签 signed (no notarization); Windows installers are unsigned (SmartScreen warning); platform feature depth per README platform table. The corresponding source archive is attached to this release. Controller: review artifacts, finalize release notes, then publish (plan D7)."
          fi
      # asset 名 = 文件 basename，必须与 make-latest.mjs 写进 feed 的下载 URL 文件名
      # 一致（darwin-aarch64 → HawkSnap.app.tar.gz），否则 updater feed 指向 404。
      # 任何一类文件缺失（如 .sig 没生成 = F2 回退）都在此处显式失败——绝不静默
      # 上传不完整的 Release。
      - name: Upload release assets (concrete files only, --clobber)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          add() {
            local pattern="$1" m
            local matches=($pattern)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "ERROR: no file matched $pattern" >&2
              exit 1
            fi
            for m in "${matches[@]}"; do
              if [ -d "$m" ]; then
                # 注意 ${m} 必须加花括号：$m 后紧跟全角括号时 bash 会把多字节字符
                # 吞进变量名（同 1061b84 的 var-boundary bug），set -u 下直接炸。
                echo "ERROR: refusing to upload directory: ${m}（run 40591912444 根因）" >&2
                exit 1
              fi
              if [ ! -f "$m" ]; then
                echo "ERROR: not a regular file: $m" >&2
                exit 1
              fi
              assets+=("$m")
            done
          }
          add_optional() {
            local pattern="$1" m
            local matches=($pattern)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "WARNING: no file matched $pattern（附加分发件缺席，不阻断发布）" >&2
              return 0
            fi
            for m in "${matches[@]}"; do
              [ -f "$m" ] && assets+=("$m")
            done
          }
          # download-artifact(pattern: release-*, merge-multiple) 布局（各腿产物
          # 的 LCA 都是 target/release/bundle → 平台子目录保留）：
          #   dist/{macos,dmg}/…        （mac arm/intel 两腿合并后按架构改名）
          #   dist/{nsis,msi}/…         （windows）
          #   dist/{appimage,deb,rpm}/… （linux）
          #   release-source 平铺在 dist 根；latest.json 由 make-latest 写入 dist 根。
          # REQUIRED = updater feed 与发布完整性相关（缺任一 = feed 404 → 硬失败）；
          # OPTIONAL = 附加分发件（dmg/msi/deb/rpm）——缺了只警告不阻断（某腿打包
          # 降级不应炸掉整个发布，feed 载荷由 REQUIRED 与 make-latest 双重把守）。
          add "dist/macos/HawkSnap_aarch64.app.tar.gz"
          add "dist/macos/HawkSnap_aarch64.app.tar.gz.sig"
          add "dist/macos/HawkSnap_x86_64.app.tar.gz"
          add "dist/macos/HawkSnap_x86_64.app.tar.gz.sig"
          add "dist/nsis/HawkSnap_*-setup.exe"
          add "dist/nsis/HawkSnap_*-setup.exe.sig"
          add "dist/appimage/*.AppImage"
          add "dist/appimage/*.AppImage.sig"
          add "dist/HawkSnap-*-source.tar.gz"
          add "dist/latest.json"
          add_optional "dist/dmg/*.dmg"
          add_optional "dist/msi/*.msi"
          add_optional "dist/msi/*.msi.zip"
          add_optional "dist/msi/*.msi.zip.sig"
          add_optional "dist/deb/*.deb"
          add_optional "dist/rpm/*.rpm"
          echo "Uploading ${#assets[@]} asset(s):"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "${assets[@]}"
