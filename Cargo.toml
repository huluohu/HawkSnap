[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0-alpha.1"

[workspace.dependencies]
hawksnap-core = { path = "crates/hawksnap-core" }
hawksnap-platform-mac = { path = "crates/hawksnap-platform-mac" }
xcap = "0.4"
image = "0.25"
thiserror = "1"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# profile 只在 workspace 根生效（app/src-tauri 里写会被 cargo 忽略）。
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
