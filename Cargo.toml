[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/*"]

[workspace.package]
edition = "2021"
version = "1.0.0"

[workspace.dependencies]
hawksnap-core = { path = "crates/hawksnap-core" }
hawksnap-ocr = { path = "crates/hawksnap-ocr" }
hawksnap-platform-mac = { path = "crates/hawksnap-platform-mac" }
xcap = "0.4"
image = "0.25"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
# SQLite 历史存储（C3）。bundled：自带 amalgamation 编译，不依赖系统 libsqlite3。
# default-features=false：默认 features 含 sqlite-wasm-rs（wasm 运行时），桌面用不到；
# 0.40 为本机缓存可离线解析的版本（0.37 未缓存，环境禁网——离线适配注记）。
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# profile 只在 workspace 根生效（app/src-tauri 里写会被 cargo 忽略）。
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# dev profile：依赖不生成调试符号（2026-11-04）
#
# 实测（arm64 macOS）：debug/deps 里 750 个 rlib 实际只对应不到 200 个不同 crate
# ——cargo 的 metadata hash 含依赖图哈希链，改一个传递依赖的 feature 就让整条下游
# 链换哈希，新代写盘、旧代原地留存（libobjc2_app_kit 一家就有 4 代 × 180MB）。
# 而单个 rlib 的对象文件里 __DWARF 占 85%（objc2-app-kit：31.3MB DWARF vs 5.7MB
# 真代码）——调试符号是 debug 缓存里最容易砍掉又最不影响使用的一块。
#
# rlib 里最大的那块是 .rmeta（objc2-app-kit 单个 114MB），那是泛型 metadata，
# **debug 设置改不动**，故本项只针对 DWARF。
#
# `"*"` 按 cargo 语义只作用于**非 workspace 成员**的依赖；本地四个 crate 仍带完整
# 调试信息——调试自己的代码时变量/类型照样可见。代价：panic 回溯里依赖 crate 没有
# 行号（不影响本地 crate）。
[profile.dev.package."*"]
debug = 0
