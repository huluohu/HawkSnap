[package]
name = "hawksnap"
version = "0.1.0-alpha.1"
description = "HawkSnap — 像鹰一样准，一按就截"
authors = ["guxiaolong"]
edition.workspace = true

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hawksnap-core.workspace = true
hawksnap-platform-mac.workspace = true
# protocol-asset：tauri.conf.json 启用 assetProtocol 的硬性要求（build script 校验）
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
chrono = "0.4"
# finish_capture 通过 image::load_from_memory 解码裁剪结果（brief 代码所需）
image.workspace = true
