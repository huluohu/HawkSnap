[package]
name = "hawksnap"
version = "0.1.0-alpha.1"
description = "HawkSnap — 像鹰一样准，一按就截"
authors = ["guxiaolong"]
edition.workspace = true

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hawksnap-core.workspace = true
hawksnap-platform-mac.workspace = true
# protocol-asset：tauri.conf.json 启用 assetProtocol 的硬性要求（build script 校验）
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
chrono = "0.4"

# 媒体键 F1 兼容（Task 13）：NSEvent 全局监听 systemDefined（亮度下键）事件。
# 0.3.2 已在依赖树（wry）中，features 只增不改版本。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2"] }
block2 = "0.6"
# Task 4 磁吸候选：CGWindowList 枚举在屏窗口。core-graphics 0.25 的 window 模块暴露
# copy_window_info + kCGWindow* 常量，core-foundation 供 CFArray/CFDictionary/CFNumber
# 迭代；两 crate 均已在依赖树（tauri/wry），大版本与 Cargo.lock 一致，不引入新解析。
core-graphics = "0.25"
core-foundation = "0.10"
